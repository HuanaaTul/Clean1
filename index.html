        const compressImageDataUrl = (dataUrl, maxDimension = 1024, quality = 0.7) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = dataUrl;
            });
        };

                        if (doc.exists) {
                            const data = doc.data();
                            if (data.zones) setZones(data.zones);
                            if (data.period) setPeriod(data.period);
                            if (data.managerPin) setManagerPin(data.managerPin);
                        } else {

                            docRef.set({

                                period: { start: '2026-11-01', end: '2026-11-30' },

                            });
                        }
                        setIsSyncing(false);
                    }, (err) => {
                        console.error("Firestore error:", err);
                        setIsSyncing(false);
                    });
                    return () => unsubscribe();

                        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);

                                    } catch (err) {

                                    }
                                }
                            })

                        status: 'pending',
                        photos: [],
                        updatedAt: null
                    }));

                    await persistSystemData(clearedZones);
                    setActiveZoneId(null);

                setCameraReady(false);

                    const mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    setStream(mediaStream);
                    if (videoRef.current) {
                        videoRef.current.srcObject = mediaStream;
                        setCameraReady(true);
                    }
                } catch (err) {
                    setCameraReady(false);
                }
            };

            const takePhoto = async () => {
                if (videoRef.current && canvasRef.current && cameraReady) {
                    const video = videoRef.current;
                    const canvas = canvasRef.current;
                    canvas.width = video.videoWidth || 1280;
                    canvas.height = video.videoHeight || 720;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const rawDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const compressed = await compressImageDataUrl(rawDataUrl, 1024, 0.7);
                    setTempPhotos(prev => [...prev, compressed]);
                }
            };

            const handleNativeCapture = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        const compressed = await compressImageDataUrl(ev.target.result, 1024, 0.7);
                        setTempPhotos(prev => [...prev, compressed]);
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            };

                                    <i className="fas fa-times"></i>
                                </button>
                            </div>

                            <div className="flex-1 relative flex flex-col items-center justify-center bg-black overflow-hidden">
                                <video ref={videoRef} autoPlay playsInline className={`absolute inset-0 w-full h-full object-cover ${cameraReady ? 'opacity-100' : 'opacity-0'}`}></video>
                                <canvas ref={canvasRef} className="hidden"></canvas>

                                {!cameraReady && (
                                    <div className="z-10 text-center p-6">
                                        <p className="text-gray-400 text-sm mb-4">กดปุ่มด้านล่างเพื่อเปิดกล้องถ่ายรูปหน้างาน</p>
                                        <button 
                                            onClick={() => fileInputRef.current?.click()} 
                                            className="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg"
                                        >
                                            <i className="fas fa-camera mr-2"></i> เปิดกล้องถ่ายภาพ
                                        </button>
                                    </div>
                                )}

                                <input 
                                    ref={fileInputRef}
                                    type="file" 
                                    accept="image/*" 
                                    capture="environment" 
                                    multiple 
                                    onChange={handleNativeCapture}
                                    className="hidden" 
                                />

                                {cameraReady && (
                                    <div className="absolute bottom-6 flex items-center gap-6 z-10">
                                        <button 
                                            onClick={takePhoto} 
                                            disabled={isUploading}
                                            className="w-16 h-16 bg-white/30 border-4 border-white rounded-full flex items-center justify-center active:scale-95 transition shadow-lg"
                                        >
                                            <div className="w-12 h-12 bg-white rounded-full"></div>
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className="bg-gray-900 border-t border-gray-800 p-4">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs text-gray-400">รูปที่ถ่ายแล้ว ({tempPhotos.length} รูป)</span>
                                    {cameraReady && !isUploading && (
                                        <button onClick={() => fileInputRef.current?.click()} className="text-xs text-blue-400 hover:underline">
                                            + ถ่ายผ่านกล้องมือถือ
                                        </button>
                                    )}
                                </div>
                                <div className="flex gap-2.5 overflow-x-auto pb-3 h-24 items-center">
                                    {tempPhotos.length === 0 ? (
                                        <p className="text-gray-600 text-xs w-full text-center">ยังไม่มีรูปถ่าย (ถ่ายได้หลายรูป)</p>
                                    ) : (
                                        tempPhotos.map((p, i) => (
                                            <div key={i} className="relative shrink-0 w-20 h-20 rounded-lg overflow-hidden border border-gray-600">
                                                <img src={p} className="w-full h-full object-cover" />
                                                {!isUploading && (
                                                    <button 
                                                        onClick={() => setTempPhotos(prev => prev.filter((_, idx) => idx !== i))} 
                                                        className="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]"
                                                    >
                                                        <i className="fas fa-times"></i>
                                                    </button>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                                <button 
                                    onClick={submitWork} 
                                    disabled={tempPhotos.length === 0 || isUploading} 
                                    className={`w-full py-3.5 rounded-xl font-bold text-sm flex justify-center items-center gap-2 transition ${tempPhotos.length > 0 && !isUploading ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
                                >
                                    {isUploading ? (
                                        <span><i className="fas fa-spinner fa-spin mr-1"></i> กำลังอัปโหลดรูปภาพขึ้นระบบ...</span>
                                    ) : (
                                        <span><i className="fas fa-paper-plane mr-1"></i> ยืนยันส่งงาน ({tempPhotos.length} รูป)</span>
                                    )}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal ขยายดูรูปภาพขนาดใหญ่ */}
                    {previewImage && (
                        <div onClick={() => setPreviewImage(null)} className="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 cursor-zoom-out">
                            <img src={previewImage} className="max-w-full max-h-full rounded-xl shadow-2xl" />
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
