        const compressImage = (dataUrl, maxDimension = 800, quality = 0.6) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                    canvas.toBlob((blob) => {
                        resolve({ dataUrl: compressedDataUrl, blob });
                    }, 'image/jpeg', quality);
                };
                img.src = dataUrl;
            });
        };

        // อัปโหลดไฟล์ Blob ขึ้น Firebase Storage พร้อมระบบตัดเวลาหาก Storage ค้าง
        const uploadBlobWithTimeout = (fileRef, blob, timeoutMs = 8000) => {
            return new Promise((resolve, reject) => {
                const uploadTask = fileRef.put(blob, { contentType: 'image/jpeg' });
                const timer = setTimeout(() => {
                    try { uploadTask.cancel(); } catch (e) {}
                    reject(new Error('STORAGE_TIMEOUT'));
                }, timeoutMs);

                uploadTask.on(
                    'state_changed',
                    null,
                    (err) => {
                        clearTimeout(timer);
                        reject(err);
                    },
                    async () => {
                        clearTimeout(timer);
                        try {
                            const url = await uploadTask.snapshot.ref.getDownloadURL();
                            resolve(url);
                        } catch (err) {
                            reject(err);
                        }
                    }
                );
            });
        };
